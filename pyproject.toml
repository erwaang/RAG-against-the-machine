[project]
name = "rag-against-the-machine"
version = "2.0.0"
description = "Retrieval-Augmented Generation over the vLLM codebase (42 project)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "fire>=0.6.0",
    "tqdm>=4.66",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "transformers>=4.51.0",
    "torch>=2.2",
    "accelerate>=0.30",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = "^(data/|\\.venv/)"

[tool.pytest.ini_options]
testpaths = ["tests"]
